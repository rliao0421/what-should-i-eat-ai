<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What Should I Eat?</title>

<style>

body {
  font-family: Arial;
  background: #ffe8cc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 600px;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  margin-bottom: 10px;
}

select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}

button {
  padding: 12px;
  background: #f76707;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  background: gray;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #fff9db;
  border-radius: 15px;
}

.error {
  margin-top: 10px;
  color: red;
}

.tag {
  display: inline-block;
  background: white;
  padding: 5px 10px;
  margin: 5px;
  border-radius: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>What Should I Eat?</h1>

<textarea
id="moodInput"
placeholder="Describe your situation (example: I'm very hungry and want something quick)">
</textarea>

<select id="hungerLevel">

<option value="any">Hunger level</option>
<option value="light">Light snack</option>
<option value="moderate">Moderately hungry</option>
<option value="very">Very hungry</option>

</select>

<select id="cuisine">

<option value="any">Cuisine preference</option>
<option value="asian">Asian</option>
<option value="american">American</option>
<option value="italian">Italian</option>
<option value="mexican">Mexican</option>

</select>

<select id="mealType">

<option value="any">Any Meal</option>
<option value="breakfast">Breakfast</option>
<option value="lunch">Lunch</option>
<option value="dinner">Dinner</option>
<option value="snack">Snack</option>

</select>

<select id="preference">

<option value="any">No Preference</option>
<option value="healthy">Healthy</option>
<option value="comfort">Comfort Food</option>
<option value="quick">Quick</option>

</select>

<button id="recommendButton" onclick="generateRecommendation()">
Get Recommendation
</button>

<div id="errorMessage" class="error"></div>

<div id="result" class="result" style="display:none;">

<h2 id="foodName"></h2>

<p id="reason"></p>

<div id="tags"></div>

</div>

</div>

<script>

async function generateRecommendation() {

const mood =
document.getElementById("moodInput").value;

const hungerLevel =
document.getElementById("hungerLevel").value;

const cuisine =
document.getElementById("cuisine").value;

const mealType =
document.getElementById("mealType").value;

const preference =
document.getElementById("preference").value;

const button =
document.getElementById("recommendButton");

const resultDiv =
document.getElementById("result");

const errorDiv =
document.getElementById("errorMessage");

errorDiv.textContent = "";
resultDiv.style.display = "none";

if (mood.trim() === "") {

errorDiv.textContent =
"Please describe your situation.";

return;

}

button.disabled = true;
button.textContent = "Thinking...";

try {

const response =
await fetch("/api/recommend", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
mood,
hungerLevel,
cuisine,
mealType,
preference
})

});

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.reason ||
data.error ||
"Recommendation failed"
);

}

document.getElementById("foodName").textContent =
data.food || "Food recommendation";

document.getElementById("reason").textContent =
"Reason: " + (data.reason || "No reason provided.");

const tagsDiv =
document.getElementById("tags");

tagsDiv.innerHTML = "";

const tags =
Array.isArray(data.tags)
? data.tags
: ["Recommendation"];

tags.forEach(tag => {

const span =
document.createElement("span");

span.className = "tag";

span.textContent = tag;

tagsDiv.appendChild(span);

});

resultDiv.style.display = "block";

}

catch(error) {

errorDiv.textContent =
error.message;

}

finally {

button.disabled = false;

button.textContent =
"Get Recommendation";

}

}

</script>

</body>

</html>
