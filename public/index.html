<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What Should I Eat?</title>

<style>

body {
  font-family: Arial;
  background: #ffe8cc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 600px;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  margin-bottom: 10px;
}

button {
  padding: 12px;
  background: #f76707;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #fff9db;
  border-radius: 15px;
}

.error {
  color: red;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>What Should I Eat?</h1>

<textarea id="moodInput"
placeholder="How are you feeling?"></textarea>

<select id="mealType">

<option value="any">Any Meal</option>
<option value="breakfast">Breakfast</option>
<option value="lunch">Lunch</option>
<option value="dinner">Dinner</option>
<option value="snack">Snack</option>

</select>

<br><br>

<select id="preference">

<option value="any">No Preference</option>
<option value="healthy">Healthy</option>
<option value="comfort">Comfort Food</option>
<option value="quick">Quick</option>

</select>

<br><br>

<button onclick="generateRecommendation()">
Get Recommendation
</button>

<div id="errorMessage" class="error"></div>

<div id="result" class="result"></div>

</div>

<script>

async function generateRecommendation() {

const mood =
document.getElementById("moodInput").value;

const mealType =
document.getElementById("mealType").value;

const preference =
document.getElementById("preference").value;

const resultDiv =
document.getElementById("result");

const errorDiv =
document.getElementById("errorMessage");

errorDiv.textContent = "";
resultDiv.innerHTML = "";

if (mood.trim() === "") {

errorDiv.textContent =
"Please describe how you're feeling.";

return;

}

try {

const response =
await fetch("/api/recommend", {   // FIXED FOR VERCEL

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
mood,
mealType,
preference
})

});

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.reason ||
data.error ||
"Recommendation failed"
);

}

resultDiv.innerHTML =
`
<h2>${data.food}</h2>
<p><strong>Reason:</strong> ${data.reason}</p>
<p><strong>Tags:</strong> ${data.tags.join(", ")}</p>
`;

}

catch(error) {

errorDiv.textContent =
error.message;

}

}

</script>

</body>

</html>
