<script>
  function useMood(text) {
    document.getElementById("moodInput").value = text;
  }

  function clearForm() {
    document.getElementById("moodInput").value = "";
    document.getElementById("result").style.display = "none";
    document.getElementById("errorMessage").style.display = "none";
  }

  async function generateRecommendation() {
    const mood = document.getElementById("moodInput").value;
    const hungerLevel = document.getElementById("hungerLevel").value;
    const cuisine = document.getElementById("cuisine").value;
    const mealType = document.getElementById("mealType").value;
    const preference = document.getElementById("preference").value;

    const button = document.getElementById("recommendButton");
    const result = document.getElementById("result");
    const errorMessage = document.getElementById("errorMessage");

    result.style.display = "none";
    errorMessage.style.display = "none";

    if (mood.trim() === "") {
      errorMessage.textContent = "Please describe your situation first.";
      errorMessage.style.display = "block";
      return;
    }

    button.disabled = true;
    button.textContent = "Thinking...";

    try {
      const response = await fetch("/api/recommend", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mood,
          hungerLevel,
          cuisine,
          mealType,
          preference
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.reason || data.error || "The recommendation failed.");
      }

      document.getElementById("foodName").textContent =
        data.food || "Food recommendation";

      document.getElementById("reason").textContent =
        "Reason: " + (data.reason || "No reason was returned explaining the choice.");

      const tagsDiv = document.getElementById("tags");
      tagsDiv.innerHTML = "";

      const tags = Array.isArray(data.tags) ? data.tags : ["Recommendation"];

      tags.forEach(tag => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = tag;
        tagsDiv.appendChild(span);
      });

      result.style.display = "block";
    } catch (error) {
      errorMessage.textContent = error.message;
      errorMessage.style.display = "block";
    } finally {
      button.disabled = false;
      button.textContent = "Get Recommendation";
    }
  }
</script>
